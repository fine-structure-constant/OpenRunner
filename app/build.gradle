plugins {
    id "com.android.application"
}

android {
    namespace "cn.edu.pku.openrunner"
    compileSdk 36

    defaultConfig {
        // Keep the Kotlin namespace stable, but use a distinct install identity
        // so the legacy OpenRunner and v2 can coexist on one device.
        applicationId "cn.edu.pku.openrunner.v2"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "2.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AMap 2D reads this value from the manifest. Override it in
        // gradle.properties for a deployment-specific key.
        manifestPlaceholders = [AMAP_API_KEY: project.findProperty("AMAP_API_KEY") ?: "19fe50e8d34fcebd76a3a126990c6edb"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-ktx:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.android.material:material:1.11.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.amap.api:map2d:6.0.0"

    testImplementation "junit:junit:4.13.2"
}
