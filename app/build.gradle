plugins {
    id "com.android.application"
}

android {
    namespace "cn.edu.pku.openrunner"
    compileSdk 36

    defaultConfig {
        // Keep the Kotlin namespace stable, but give each UI generation its own install identity.
        // Install IDs in use:
        //   cn.edu.pku.openrunner       legacy
        //   cn.edu.pku.openrunner.v2    original v2
        //   cn.edu.pku.openrunner.v2pro v2-pro (default look)
        //   cn.edu.pku.openrunner.newui this build (new UI), installs alongside all of the above
        applicationId "cn.edu.pku.openrunner.newui"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "craft by hrx"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AMap 2D reads this value from the manifest. Override it in
        // gradle.properties for a deployment-specific key.
        manifestPlaceholders = [AMAP_API_KEY: project.findProperty("AMAP_API_KEY") ?: "19fe50e8d34fcebd76a3a126990c6edb"]
        ndk {
            // AMap 11.x officially ships these two ABIs.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-ktx:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.android.material:material:1.11.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.amap.api:3dmap-location-search:11.2.100_loc11.2.100_sea9.8.1"

    testImplementation "junit:junit:4.13.2"
}
