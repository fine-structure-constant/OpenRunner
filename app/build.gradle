plugins {
    id "com.android.application"
}

android {
    namespace "cn.edu.pku.openrunner"
    compileSdk 36

    defaultConfig {
        // Keep the Kotlin namespace stable, but give each UI generation its own install identity.
        // Install IDs in use:
        //   cn.edu.pku.openrunner       legacy
        //   cn.edu.pku.openrunner.v2    original v2
        //   cn.edu.pku.openrunner.v2pro v2-pro (default look)
        //   cn.edu.pku.openrunner.newui this build (new UI), installs alongside all of the above
        applicationId "cn.edu.pku.openrunner.newui"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "craft by hrx"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AMap 2D reads this value from the manifest. Override it in
        // gradle.properties for a deployment-specific key.
        manifestPlaceholders = [AMAP_API_KEY: project.findProperty("AMAP_API_KEY") ?: "19fe50e8d34fcebd76a3a126990c6edb"]
        ndk {
            // AMap 11.x officially ships these two ABIs.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-ktx:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.android.material:material:1.11.0"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.amap.api:3dmap-location-search:11.2.100_loc11.2.100_sea9.8.1"

    testImplementation "junit:junit:4.13.2"
}

// ---------------------------------------------------------------------------
// Android Studio 的「Make」需要下面两个任务，而 AGP 9 不再创建它们。
//
// IDE 实际跑的是（Android Studio 日志 idea.log 里能看到这一行）：
//     :app:assemble :app:unitTestClasses :app:androidTestClasses
// 后两个是 IDE 按自己的 source set 名字（unitTest / androidTest）拼出来的
// 「<名字>Classes」生命周期任务 —— 这是 Java 插件时代的约定。AGP 9 只提供
// compileDebugUnitTestSources / compileDebugAndroidTestSources，于是 IDE 的构建
// 还没开始就失败：
//     Cannot locate tasks that match ':app:unitTestClasses' as task
//     'unitTestClasses' not found in project ':app'
//
// 命令行构建不受影响（走 assembleDebug / testDebugUnitTest），所以这个问题只在 IDE 里出现。
// 这里把两个生命周期任务补上，各自指向真正的编译任务。
//
// 放在 afterEvaluate 里、并且先 findByName 查一次：万一将来的 AGP 自己创建了同名任务，
// 再注册一遍会让构建直接失败（同名任务冲突），所以要让它有机会先建。
afterEvaluate {
    if (tasks.findByName("unitTestClasses") == null) {
        tasks.register("unitTestClasses") {
            group = "build"
            description = "编译单元测试源码（Android Studio 的 Make 会要这个任务）"
            dependsOn("compileDebugUnitTestSources")
        }
    }
    if (tasks.findByName("androidTestClasses") == null) {
        tasks.register("androidTestClasses") {
            group = "build"
            description = "编译仪器测试源码（Android Studio 的 Make 会要这个任务）"
            dependsOn("compileDebugAndroidTestSources")
        }
    }
}
